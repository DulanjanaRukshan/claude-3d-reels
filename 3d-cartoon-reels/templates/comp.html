function drawEnding(t) {

    g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 40; g.shadowOffsetY = 18;
    rr(-400, -105, 800, 210, 105); g.fillStyle = '#ff2b2b'; g.fill(); g.shadowColor = 'transparent';
    g.fillStyle = '#fff'; rr(-330, -48, 120, 96, 26); g.fill();
    g.fillStyle = '#ff2b2b'; g.beginPath(); g.moveTo(-285, -26); g.lineTo(-285, 26); g.lineTo(-240, 0); g.closePath(); g.fill();

}

}
